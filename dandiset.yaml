- description: 'The Autism Rat Consortium (ARC) seeks to capitalize on the rat as
    an experimental system to advance our understanding of the behavioral and circuit
    neuroscience mechanisms underlying autism and related neurodevelopmental disorders.
    The ARC was established in 2022 following an RFA that funded investigators to
    use SFARI rat models with CRISPR/Cas9-induced loss of function of high-confidence
    autism risk genes to study behaviors and circuits relevant to autism. The SFARI
    rat models were generated at the Medical College of Wisconsin and are available
    to all researchers at minimal cost. Rats are larger than mice (making it more
    feasible to study early developmental time points), are more easily trained on
    complex behavioral tasks, and have a richer social behavior repertoire. The SFARI
    rat lines were also generated on an outbred genetic background, making it possible
    to study gene penetrance and individual variability. These rat lines are also
    being behaviorally characterized at the Simons Initiative for the Developing Brain
    (SIDB) in Edinburgh, Scotland. SFARI held a second RFA which funded 8 projects
    involving 16 investigators. ARC members are working collaboratively to study the
    behavior and neurophysiology underlying social interaction (including play behavior),
    sensory processing, navigation, and learning & memory. '
  name: SFARI Autism Rat Models Consortium (ARC)
  schemaKey: Project
